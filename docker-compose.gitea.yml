# Optional code host for a self-hosted Multica: a Gitea instance beside the
# stack, stored in Multica's PostgreSQL (database `gitea`, its own role).
# Set GITEA_DB_PASSWORD and GITEA_ADMIN_PASSWORD in .env, then:
#
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.gitea.yml up -d
#
# Add --profile ci for the Actions runner. See docs/gitea-code-host.zh.md.
#
# GITEA_ROOT_URL must be the address people and runtimes use to reach Gitea,
# because Gitea writes it into clone URLs, links and webhook payloads. Multica
# itself talks to Gitea inside the stack at http://gitea:3000.
services:
  gitea-db-init:
    image: pgvector/pgvector:pg17
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-multica}
      PGPASSWORD: ${POSTGRES_PASSWORD:-multica}
      PGDATABASE: ${POSTGRES_DB:-multica}
      GITEA_DB_NAME: ${GITEA_DB_NAME:-gitea}
      GITEA_DB_USER: ${GITEA_DB_USER:-gitea}
      GITEA_DB_PASSWORD: ${GITEA_DB_PASSWORD:?set GITEA_DB_PASSWORD in .env}
    entrypoint: ["sh", "/scripts/db-init.sh"]
    volumes:
      - ./deploy/gitea/db-init.sh:/scripts/db-init.sh:ro

  gitea:
    image: ${GITEA_IMAGE:-gitea/gitea:28.4.0}
    restart: unless-stopped
    depends_on:
      gitea-db-init:
        condition: service_completed_successfully
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA____APP_NAME: ${GITEA_APP_NAME:-Vertex AI}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:?set GITEA_DB_PASSWORD in .env}
      GITEA__database__SSL_MODE: disable
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3300/}
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-localhost}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__DISABLE_SSH: ${GITEA_DISABLE_SSH:-false}
      # No web installer: the database comes from the settings above and the
      # first administrator from gitea-bootstrap.
      GITEA__security__INSTALL_LOCK: "true"
      # Requests reach Gitea through Docker's port forwarding or a proxy in the
      # stack, both inside Docker's address range.
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: 127.0.0.0/8,::1/128,172.16.0.0/12
      # Outgoing requests (webhooks): public hosts are always allowed in lax
      # mode, non-public ones only when listed. Multica is non-public
      # (http://backend:8080 inside the stack). Narrow the list to a CIDR if
      # Gitea should reach nothing else on the internal network.
      GITEA__security__EGRESS_MODE: lax
      GITEA__security__ALLOWED_HOST_LIST: ${GITEA_WEBHOOK_ALLOWED_HOSTS:-private,loopback}
      GITEA__service__DISABLE_REGISTRATION: ${GITEA_DISABLE_REGISTRATION:-false}
      GITEA__service__ENABLE_CAPTCHA: ${GITEA_ENABLE_CAPTCHA:-true}
      GITEA__service__EMAIL_DOMAIN_ALLOWLIST: ${GITEA_EMAIL_DOMAIN_ALLOWLIST:-}
      GITEA__service__REQUIRE_SIGNIN_VIEW: ${GITEA_REQUIRE_SIGNIN_VIEW:-true}
      GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      GITEA__actions__ENABLED: "true"
    # Both ports stay on 127.0.0.1 unless bound to the server's internal
    # address: Docker's port publishing bypasses the host firewall, so 0.0.0.0
    # on a server that also has a public address exposes them to the internet.
    ports:
      - "${GITEA_BIND:-127.0.0.1}:${GITEA_HTTP_PORT:-3300}:3000"
      - "${GITEA_SSH_BIND:-127.0.0.1}:${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  gitea-bootstrap:
    image: ${GITEA_IMAGE:-gitea/gitea:28.4.0}
    restart: "no"
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-vertex-admin}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-vertex-admin@vertex.local}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?set GITEA_ADMIN_PASSWORD in .env}
      GITEA_RUNNER_ORG: ${GITEA_RUNNER_ORG:-}
    entrypoint: ["sh", "/scripts/bootstrap.sh"]
    volumes:
      - ./deploy/gitea/bootstrap.sh:/scripts/bootstrap.sh:ro
      - gitea_data:/data
      - gitea_runner_token:/runner-token

  # Runs Gitea Actions workflows, so pull requests get build results.
  # Registered with the token gitea-bootstrap writes: instance-wide, or only
  # for GITEA_RUNNER_ORG when that is set. Each job runs in a container the
  # runner starts through the host's Docker socket, which is root on the host:
  # with open registration, set GITEA_RUNNER_ORG so only that organization's
  # repositories can run jobs.
  gitea-runner:
    image: ${GITEA_RUNNER_IMAGE:-gitea/runner:6.0.0}
    restart: unless-stopped
    profiles: ["ci"]
    depends_on:
      gitea-bootstrap:
        condition: service_completed_successfully
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /runner-token/token
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-multica-runner}
      # What `runs-on: ubuntu-latest` means here: an image with git and node.
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:22-bookworm}
      CONFIG_FILE: /config/runner.yaml
    volumes:
      - ./deploy/gitea/runner.yaml:/config/runner.yaml:ro
      - gitea_runner_data:/data
      - gitea_runner_token:/runner-token:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gitea_data:
  gitea_runner_data:
  gitea_runner_token:
