# HTTPS entry for a Multica deployed inside the company network and reached
# by internal IP address (or an internal host name): nginx in front of the
# stack. Set PROXY_HOST in .env, then:
#
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.proxy.yml up -d
#
# Add docker-compose.gitea.yml to serve Gitea on port 3443 as well. Point the
# stack's addresses at the proxy, e.g. for PROXY_HOST=10.0.0.5:
#
#   FRONTEND_ORIGIN=https://10.0.0.5
#   MULTICA_PUBLIC_URL=https://10.0.0.5
#   GITEA_ROOT_URL=https://10.0.0.5:3443/
#
# The proxy publishes its ports on PROXY_HOST only, so on a server that also
# has a public address nothing is reachable from outside; Docker's port
# publishing bypasses the host firewall, so the bind address is what keeps it
# internal. Frontend, backend and Gitea's HTTP port stay on 127.0.0.1.
#
# PROXY_TLS picks the certificate: selfsigned (the default; clients trust
# data/proxy-certs/ca.pem) or provided (your fullchain.pem and privkey.pem in
# PROXY_CERT_DIR). See docs/self-host-https.zh.md.
services:
  proxy:
    image: ${NGINX_IMAGE:-nginx:1.30.6}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      PROXY_HOST: ${PROXY_HOST:?set PROXY_HOST in .env to the internal address clients use}
      PROXY_TLS: ${PROXY_TLS:-selfsigned}
      PROXY_HTTPS_PORT: ${PROXY_HTTPS_PORT:-443}
    entrypoint: ["sh", "/proxy-entrypoint.sh"]
    ports:
      - "${PROXY_BIND:-${PROXY_HOST}}:${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_BIND:-${PROXY_HOST}}:${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_BIND:-${PROXY_HOST}}:${PROXY_GITEA_PORT:-3443}:3443"
    volumes:
      - ./deploy/nginx/entrypoint.sh:/proxy-entrypoint.sh:ro
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ${PROXY_CERT_DIR:-./data/proxy-certs}:/etc/nginx/certs
